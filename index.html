<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PowerPoint to Premium HTML Converter</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-primary: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Outfit', system-ui, -apple-system, sans-serif;
      --bg-app: #0b0f19;
      --bg-card: rgba(17, 24, 39, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --glass-blur: 16px;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-primary);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow-x: hidden;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }

    .glow-1 {
      top: -10%; left: 20%;
      width: 400px; height: 400px;
      background: rgba(59, 130, 246, 0.15);
    }

    .glow-2 {
      bottom: -10%; right: 20%;
      width: 450px; height: 450px;
      background: rgba(139, 92, 246, 0.15);
    }

    .container {
      width: 100%; max-width: 680px;
      z-index: 10; position: relative;
    }

    .header-panel {
      text-align: center; margin-bottom: 2rem;
    }

    .brand-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2);
      color: var(--accent); padding: 0.35rem 0.85rem; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--font-display);
      font-size: 2.5rem; font-weight: 700; letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted); font-size: 1rem; line-height: 1.6; max-width: 540px; margin: 0 auto;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border-color);
      border-radius: 20px; padding: 2.5rem;
      box-shadow: var(--shadow-lg); transition: all 0.3s ease;
    }

    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px; padding: 3rem 2rem;
      text-align: center; cursor: pointer; transition: all 0.2s ease;
      background: rgba(17, 24, 39, 0.3); position: relative;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent); background: rgba(59, 130, 246, 0.05);
      transform: scale(1.01);
    }

    .icon-wrapper {
      width: 64px; height: 64px;
      background: var(--accent-gradient); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem; color: white;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .icon-wrapper svg { width: 32px; height: 32px; fill: currentColor; }

    .dropzone h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.35rem; }
    .dropzone p { color: var(--text-muted); font-size: 0.875rem; }

    .file-input { display: none; }

    .file-preview {
      display: none; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 1rem 1.25rem; margin-top: 1.5rem;
    }

    .file-preview.active { display: flex; }

    .file-info { display: flex; align-items: center; gap: 0.85rem; }
    .file-icon { color: var(--accent); }
    .file-name { font-weight: 600; font-size: 0.95rem; }
    .file-size { color: var(--text-muted); font-size: 0.8rem; }

    .remove-file {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; padding: 0.25rem; border-radius: 6px; transition: all 0.2s;
    }

    .remove-file:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

    .btn-convert {
      width: 100%; margin-top: 1.5rem; padding: 1rem;
      background: var(--accent-gradient); color: white; border: none;
      border-radius: 12px; font-family: var(--font-primary);
      font-size: 1rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
      transition: all 0.2s ease;
    }

    .btn-convert:hover:not(:disabled) {
      filter: brightness(1.1); transform: translateY(-2px);
    }

    .btn-convert:disabled {
      opacity: 0.5; cursor: not-allowed; box-shadow: none;
    }

    .progress-panel {
      display: none; margin-top: 1.5rem;
    }

    .progress-panel.active { display: block; }

    .progress-bar-bg {
      width: 100%; height: 8px; background: rgba(255, 255, 255, 0.08);
      border-radius: 4px; overflow: hidden; margin-bottom: 1rem;
    }

    .progress-bar-fill {
      height: 100%; width: 0%; background: var(--accent-gradient);
      border-radius: 4px; transition: width 0.3s ease;
    }

    .status-text {
      font-size: 0.875rem; color: var(--text-muted); text-align: center; font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">
    <div class="header-panel">
      <div class="brand-badge">Vercel Ready & Serverless</div>
      <h1>PowerPoint to HTML</h1>
      <p class="subtitle">Convert `.pptx` decks into standalone, responsive HTML presentations directly from your web browser.</p>
    </div>

    <div class="card">
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
        </div>
        <h3>Drop presentation here</h3>
        <p>or click to browse from your computer (.pptx)</p>
        <input type="file" id="fileInput" class="file-input" accept=".pptx" onchange="handleFileSelect(event)">
      </div>

      <div class="file-preview" id="filePreview">
        <div class="file-info">
          <div class="file-icon">
            <svg style="width:24px;height:24px;fill:currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
          </div>
          <div>
            <div class="file-name" id="fileName">presentation.pptx</div>
            <div class="file-size" id="fileSize">0 MB</div>
          </div>
        </div>
        <button class="remove-file" onclick="removeSelectedFile()" title="Remove file">
          <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <button class="btn-convert" id="convertBtn" disabled onclick="startConversion()">
        <span>Convert to HTML</span>
      </button>

      <div class="progress-panel" id="progressPanel">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="status-text" id="statusText">Uploading presentation file...</div>
      </div>
    </div>
  </div>

  <script>
    let selectedFile = null;

    function handleFileSelect(e) {
      const files = e.target.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    }

    function processFile(file) {
      if (!file.name.endsWith('.pptx')) {
        alert('Please select a valid .pptx PowerPoint file.');
        return;
      }
      selectedFile = file;
      document.getElementById('fileName').textContent = file.name;
      document.getElementById('fileSize').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
      document.getElementById('filePreview').classList.add('active');
      document.getElementById('convertBtn').disabled = false;
    }

    function removeSelectedFile() {
      selectedFile = null;
      document.getElementById('fileInput').value = '';
      document.getElementById('filePreview').classList.remove('active');
      document.getElementById('convertBtn').disabled = true;
    }

    async function startConversion() {
      if (!selectedFile) return;

      document.getElementById('convertBtn').disabled = true;
      document.getElementById('progressPanel').classList.add('active');
      
      const progressBar = document.getElementById('progressBar');
      const statusText = document.getElementById('statusText');

      progressBar.style.width = '20%';
      statusText.textContent = 'Uploading presentation file to serverless API...';

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        
        let p = 20;
        const progressInterval = setInterval(() => {
          if (p < 85) {
            p += 5;
            progressBar.style.width = p + '%';
            if (p > 50) statusText.textContent = 'Extracting slide layouts & video media...';
          }
        }, 400);

        const response = await fetch('/api/upload', {
          method: 'POST',
          headers: {
            'X-File-Name': encodeURIComponent(selectedFile.name)
          },
          body: arrayBuffer
        });

        clearInterval(progressInterval);

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(errText || 'Conversion failed on server.');
        }

        progressBar.style.width = '100%';
        statusText.textContent = 'Conversion complete! Opening presentation...';

        const data = await response.json();
        setTimeout(() => {
          if (data.redirect) {
            window.location.href = data.redirect;
          }
        }, 500);

      } catch (err) {
        alert('Error: ' + err.message);
        document.getElementById('progressPanel').classList.remove('active');
        document.getElementById('convertBtn').disabled = false;
      }
    }

    const dropzone = document.getElementById('dropzone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        processFile(files[0]);
      }
    });
  </script>
</body>
</html>
